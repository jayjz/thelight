<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>
  @font-face {
    font-family: "LSN";
    src: url("file:///usr/share/fonts/truetype/liberation/LiberationSansNarrow-Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
  }
  @font-face {
    font-family: "LSN";
    src: url("file:///usr/share/fonts/truetype/liberation/LiberationSansNarrow-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: "LM";
    src: url("file:///usr/share/fonts/truetype/liberation/LiberationMono-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
  }
  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    background: #08090b;
    overflow: hidden;
    color: #dfe3ea;
  }
  .stage {
    position: relative;
    width: 1200px;
    height: 630px;
  }
  svg.bg {
    position: absolute;
    inset: 0;
  }
  .lockup {
    position: absolute;
    left: 0;
    right: 0;
    top: 168px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }
  .mark {
    display: flex;
    gap: 10px;
    margin-bottom: 26px;
  }
  .mark i {
    display: block;
    width: 14px;
    height: 48px;
    background: #dfe3ea;
  }
  h1 {
    margin: 0;
    font-family: "LSN", "Liberation Sans Narrow", sans-serif;
    font-weight: 700;
    font-size: 128px;
    line-height: 0.92;
    letter-spacing: 0.05em;
    color: #dfe3ea;
    text-indent: 0.05em;
  }
  .rule {
    width: 220px;
    height: 1px;
    background: #a8b2c1;
    opacity: 0.55;
    margin: 22px 0 16px;
  }
  .tag {
    margin: 0;
    font-family: "LSN", "Liberation Sans Narrow", sans-serif;
    font-weight: 400;
    font-size: 15px;
    letter-spacing: 0.46em;
    color: #a8b2c1;
    text-indent: 0.46em;
  }
  .micro-l, .micro-r {
    position: absolute;
    bottom: 36px;
    font-family: "LM", "Liberation Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: #a8b2c1;
    opacity: 0.78;
  }
  .micro-l { left: 48px; }
  .micro-r { right: 48px; }
  .micro-t {
    position: absolute;
    top: 36px;
    left: 48px;
    right: 48px;
    display: flex;
    justify-content: space-between;
    font-family: "LM", "Liberation Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: #a8b2c1;
    opacity: 0.7;
  }
</style>
